name: nf-core engineering lint
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  nf-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.10+7'
      - uses: nf-core/setup-nextflow@6c2e22b4d901f0c42ca66c5069f8026df026d165
        with:
          version: '25.10.4'
      - run: python -m pip install nf-core==4.2.0
      - name: Strict Nextflow parser
        run: NXF_VER=26.10.3 nextflow lint .
      - run: nf-core pipelines lint --dir . --json lint-results.json --markdown lint-results.md
      - run: nf-core modules lint --dir . --all --local --plain-text | tee module-lint.txt
      - run: nf-core subworkflows lint --dir . --all --local --plain-text | tee subworkflow-lint.txt
      - run: nf-core pipelines schema lint --dir .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: engineering-lint-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            lint-results.*
            module-lint.txt
            subworkflow-lint.txt
