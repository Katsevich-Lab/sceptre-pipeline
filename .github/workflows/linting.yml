name: nf-core engineering lint
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  nf-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.8'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.10+7'
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
        with:
          version: '25.10.4'
          java-version: '17.0.10+7'
          java-distribution: temurin
      - name: Assert final installed JVM and exact Nextflow release
        run: NXF_VER=25.10.4 python3 tests/ci/check-engine-identity.py 25.10.4 host-engine.json
      - run: python -m pip install nf-core==4.2.0
      - name: Strict Nextflow parser
        run: NXF_VER=26.10.3 nextflow lint .
      - run: nf-core pipelines lint --dir . --json lint-results.json --markdown lint-results.md
      - run: nf-core modules lint --dir . --all --local --plain-text | tee module-lint.txt
      - run: nf-core subworkflows lint --dir . --all --local --plain-text | tee subworkflow-lint.txt
      - run: nf-core pipelines schema lint --dir .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: engineering-lint-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            host-engine*
            lint-results.*
            module-lint.txt
            subworkflow-lint.txt
