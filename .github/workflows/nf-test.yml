            ${{ runner.temp }}/apptainer-*.txt
            ${{ runner.temp }}/apptainer-*.log
            ${{ runner.temp }}/sif-*.json
            ${{ runner.temp }}/sif-*.txt
            ${{ runner.temp }}/sif-*.log
            ${{ runner.temp }}/sif-context/source.json
            ${{ runner.temp }}/sif-context-receipt.json
            ${{ runner.temp }}/apptainer-parity/resource-observations.json
            ${{ runner.temp }}/apptainer-parity/*/pipeline_info
            ${{ runner.temp }}/apptainer-parity/*/resolved_settings.json
            ${{ runner.temp }}/apptainer-parity/*work/**/.command.*
            ${{ runner.temp }}/apptainer-launcher/*.json
            ${{ runner.temp }}/apptainer-launcher/*.log
            ${{ runner.temp }}/apptainer-launcher/**/pipeline_info
            ${{ runner.temp }}/apptainer-launcher/run/results/exports/scientific-report
