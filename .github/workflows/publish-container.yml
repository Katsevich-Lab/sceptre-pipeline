name: Exact image review and approved artifact promotion
on:
  push:
    branches: ['codex/container-review-*']
    paths:
      - '.github/workflows/publish-container.yml'
      - '.github/scripts/review_image.py'
      - '.github/scripts/test_review_image.py'
      - 'container/Dockerfile'
  workflow_dispatch:
    inputs:
      approve_publication:
        description: 'Explicitly approve upload to ghcr.io/katsevich-lab/sceptre-pipeline (does not change visibility)'
        type: boolean
        default: false
        required: true
      review_run_id:
        description: 'Successful originating image-review run ID (required for promotion)'
        type: string
        default: ''
      review_artifact_id:
        description: 'Exact immutable reviewed image artifact ID (required for promotion)'
        type: string
        default: ''
      expected_source_sha:
        description: 'Approved exact originating checkout commit SHA'
        type: string
        default: ''
      expected_image_id:
        description: 'Approved immutable Docker sha256 image ID'
        type: string
        default: ''
      expected_archive_sha256:
        description: 'Approved SHA256 of the tested image.tar.gz bytes'
        type: string
        default: ''
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build-review:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.approve_publication }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NXF_VER: '25.10.4'
      NXF_ANSI_LOG: 'false'
      NXF_OPTS: '-Xms256m -Xmx1g'
      SCEPTRE_CONTAINER_ENGINE: docker
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.8'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.10+7'
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
        with:
          version: '25.10.4'
          java-version: '17.0.10+7'
          java-distribution: temurin
      - name: Bind actual checkout and test artifact admission guards
        run: |
          [[ "$GITHUB_REF_NAME" == codex/container-review-* ]] || { echo "Image review requires a dedicated codex/container-review-* branch" >&2; exit 1; }
          echo "REVIEW_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python -m unittest discover -s .github/scripts -p 'test_review_image.py' -v
      - name: Assert final installed JVM and exact Nextflow release
        run: python3 tests/ci/check-engine-identity.py "$NXF_VER" "$RUNNER_TEMP/host-engine.json"
      - name: Build the exact AMD64 image and record immutable identity
        run: |
          python3 tests/ci/check-runtime-source.py
          python3 tests/ci/source-snapshot.py --output "$RUNNER_TEMP/source-before.json"
          python3 container/prepare-context.py --source-manifest tests/runtime/source.json --output "$RUNNER_TEMP/context" > "$RUNNER_TEMP/context-receipt.json"
          docker build --platform linux/amd64 --progress plain --label org.opencontainers.image.source=https://github.com/Katsevich-Lab/sceptre-pipeline --label "org.opencontainers.image.revision=${REVIEW_SOURCE_SHA}" --iidfile "$RUNNER_TEMP/image-id" --tag sceptre-publication-review:local "$RUNNER_TEMP/context" 2>&1 | tee "$RUNNER_TEMP/build.log"
          image_id=$(cat "$RUNNER_TEMP/image-id")
          docker image inspect "$image_id" > "$RUNNER_TEMP/image-inspect.json"
          python3 - <<'PY_IMAGE'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          image = json.loads((root / 'image-inspect.json').read_text())[0]
          assert image['Id'] == (root / 'image-id').read_text().strip()
          assert image['Architecture'] == 'amd64' and image['Os'] == 'linux'
          assert image['Config']['Labels']['org.opencontainers.image.revision'] == os.environ['REVIEW_SOURCE_SHA']
          assert image['Config']['Labels']['org.opencontainers.image.source'] == 'https://github.com/Katsevich-Lab/sceptre-pipeline'
          assert image['Config']['Labels']['org.opencontainers.image.licenses'] == 'GPL-3.0-only'
          assert image['Config']['Labels']['org.opencontainers.image.vendor'] == 'Katsevich Lab'
          PY_IMAGE
          echo "SCEPTRE_CONTAINER_IMAGE=$image_id" >> "$GITHUB_ENV"
          docker run --rm "$image_id" sh -c 'cat /opt/sceptre/source.json /opt/sceptre/session-info.txt /opt/sceptre/packages.tsv' > "$RUNNER_TEMP/runtime-provenance.txt"
      - name: Qualify the installed scientific package in the immutable image
        run: |
          timeout 20m docker run --rm -v "$PWD:$PWD" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD" "$SCEPTRE_CONTAINER_IMAGE" Rscript --vanilla tests/ci/check-installed-package.R tests/runtime/sceptre_0.99.0.tar.gz "$RUNNER_TEMP/installed-package" 2>&1 | tee "$RUNNER_TEMP/installed-package.log"
      - name: Qualify native HDF5 science against public R, checkpoint and resume
        run: |
          timeout 20m bash tests/run-parity-nextflow.sh "$RUNNER_TEMP/scientific-parity" 2>&1 | tee "$RUNNER_TEMP/scientific-parity.log"
      - name: Freeze precisely the scientifically qualified image bytes
        run: |
          python3 tests/ci/source-snapshot.py --output "$RUNNER_TEMP/source-after.json"
          python3 - <<'PY_SOURCE'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          assert json.loads((root / 'source-before.json').read_text()) == json.loads((root / 'source-after.json').read_text()), 'Source or qualification harness changed during image review'
          assert json.loads((root / 'scientific-parity/source-before.json').read_text()) == json.loads((root / 'scientific-parity/source-after.json').read_text()), 'Scientific source changed'
          PY_SOURCE
          docker image inspect sceptre-publication-review:local > "$RUNNER_TEMP/pre-save-inspect.json"
          python3 -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"] + "/pre-save-inspect.json"))[0]["Id"] == os.environ["SCEPTRE_CONTAINER_IMAGE"]'
          docker save sceptre-publication-review:local | gzip > "$RUNNER_TEMP/image.tar.gz"
          (cd "$RUNNER_TEMP" && sha256sum image.tar.gz > image.sha256)
          python3 - <<'PY_REVIEW'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          source = json.loads((root / 'source-after.json').read_text())
          assert source['git_head'] == os.environ['REVIEW_SOURCE_SHA']
          helpers = {name: hashlib.sha256((pathlib.Path('.github/scripts') / name).read_bytes()).hexdigest() for name in ('review_image.py', 'test_review_image.py')}
          receipt = dict(kind='scientifically-qualified-image-review', status='PASS',
              source_sha=os.environ['REVIEW_SOURCE_SHA'], repository=os.environ['GITHUB_REPOSITORY'],
              run_id=int(os.environ['GITHUB_RUN_ID']), run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
              image_id=os.environ['SCEPTRE_CONTAINER_IMAGE'], archive_sha256=(root / 'image.sha256').read_text().split()[0],
              production_sha256=source['production_sha256'], qualification_sha256=source['qualification_sha256'],
              review_helpers_sha256=helpers, approval_input=False,
              gates=['installed-package', 'native-HDF5-public-R-all-families', 'power-checkpoint', 'unchanged-resume', 'source-unchanged'])
          (root / 'review-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY_REVIEW
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-exact-source-image-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/image.tar.gz
            ${{ runner.temp }}/review-receipt.json
            ${{ runner.temp }}/image.sha256
            ${{ runner.temp }}/image-id
            ${{ runner.temp }}/image-inspect.json
            ${{ runner.temp }}/source-before.json
            ${{ runner.temp }}/source-after.json
            ${{ runner.temp }}/context/source.json
            ${{ runner.temp }}/context-receipt.json
            ${{ runner.temp }}/host-engine*
            ${{ runner.temp }}/runtime-provenance.txt
            ${{ runner.temp }}/installed-package/runtime.json
            ${{ runner.temp }}/installed-package/tests.json
            ${{ runner.temp }}/installed-package/session.txt
            ${{ runner.temp }}/scientific-parity/source-before.json
            ${{ runner.temp }}/scientific-parity/source-after.json
            ${{ runner.temp }}/scientific-parity/resource-observations.json
            ${{ runner.temp }}/scientific-parity/full/pipeline_info
            ${{ runner.temp }}/scientific-parity/continued/pipeline_info
            ${{ runner.temp }}/scientific-parity/full/resolved_settings.json
            ${{ runner.temp }}/scientific-parity/continued/resolved_settings.json
            ${{ runner.temp }}/scientific-parity/full/exports/scientific-report
            ${{ runner.temp }}/scientific-parity/continued/exports/scientific-report
            ${{ runner.temp }}/*.log
      - name: Preserve diagnostics even when qualification fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-build-review-diagnostics
          retention-days: 14
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/source-*.json
            ${{ runner.temp }}/context/source.json
            ${{ runner.temp }}/context-receipt.json
            ${{ runner.temp }}/image-id
            ${{ runner.temp }}/image-inspect.json
            ${{ runner.temp }}/host-engine*
            ${{ runner.temp }}/runtime-provenance.txt
            ${{ runner.temp }}/installed-package/*.json
            ${{ runner.temp }}/installed-package/session.txt
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/scientific-parity/source-*.json
            ${{ runner.temp }}/scientific-parity/resource-observations.json
            ${{ runner.temp }}/scientific-parity/*.log
            ${{ runner.temp }}/scientific-parity/*/pipeline_info
            ${{ runner.temp }}/scientific-parity/*work/**/.command.log
            ${{ runner.temp }}/scientific-parity/*work/**/.command.err
            ${{ runner.temp }}/scientific-parity/*work/**/.command.out
  publish-approved-amd64:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_publication }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Configure a human reviewer before admitting this manual promotion route.
    environment: container-publication
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      REVIEW_RUN_ID: ${{ inputs.review_run_id }}
      REVIEW_ARTIFACT_ID: ${{ inputs.review_artifact_id }}
      REVIEW_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      REVIEW_IMAGE_ID: ${{ inputs.expected_image_id }}
      REVIEW_ARCHIVE_SHA256: ${{ inputs.expected_archive_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.8'
      - name: Verify successful originating workflow, run, source and exact artifact ID
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/review_image.py origin origin.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.review_artifact_id }}
          run-id: ${{ inputs.review_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          digest-mismatch: error
          path: image
      - name: Verify precisely the approved archive and load its existing image
        run: |
          python .github/scripts/review_image.py local archive-admission.json
          gunzip -c image/image.tar.gz | docker load
          docker image inspect "$REVIEW_IMAGE_ID" > image/loaded-inspect.json
          python .github/scripts/review_image.py loaded loaded-admission.json
      - name: Promote the verified existing image without rebuilding
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          ref="ghcr.io/katsevich-lab/sceptre-pipeline:source-${REVIEW_SOURCE_SHA}-amd64-review-${REVIEW_RUN_ID}-${REVIEW_ARTIFACT_ID}"
          docker tag "$REVIEW_IMAGE_ID" "$ref"
          docker push "$ref" 2>&1 | tee image/push.log
          docker image inspect "$ref" > image/pushed-inspect.json
          digest=$(python3 -c 'import json; print(next(x for x in json.load(open("image/pushed-inspect.json"))[0]["RepoDigests"] if x.startswith("ghcr.io/katsevich-lab/sceptre-pipeline@sha256:")))')
          printf '%s\n' "$digest" | tee image/published-digest.txt
          docker pull "$digest" 2>&1 | tee image/pull.log
          docker logout ghcr.io
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: approved-container-publication-receipt
          path: |
            origin.json
            archive-admission.json
            loaded-admission.json
            image/review-receipt.json
            image/published-digest.txt
            image/push.log
            image/pull.log
            image/context/source.json
            image/image-inspect.json
            image/loaded-inspect.json
            image/image-id
            image/image.sha256
            image/source-before.json
            image/source-after.json
            image/host-engine*
            image/runtime-provenance.txt
            image/scientific-parity/source-*.json
            image/context-receipt.json
