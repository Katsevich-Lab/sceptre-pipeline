name: Reviewed image admission only

on:
  push:
    branches: [codex/image-admission-20261023]
    paths:
      - .github/workflows/review-image-admission.yml
      - .github/scripts/review_image.py
      - .github/scripts/test_review_image.py

permissions:
  contents: read
  actions: read

jobs:
  verify-saved-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REVIEW_RUN_ID: '39904756647'
      REVIEW_ARTIFACT_ID: '12480892891'
      REVIEW_SOURCE_SHA: c13e94da0b8e9a54a2dd2460ad8514d04bd0fee0
      REVIEW_IMAGE_ID: sha256:02809df79df55e61c05cbf5e7cfd60065c3311719102976983a3c12d7bb6edcc
      REVIEW_ARCHIVE_SHA256: 1dcbe3a5d8b290c8ca28ffb67a065872e23e8d79877587199bffa230d346b688
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Bind admission helper and reject offline mutations
        run: |
          mkdir -p admission
          git rev-parse HEAD > admission/executing-source.txt
          sha256sum .github/scripts/review_image.py .github/scripts/test_review_image.py > admission/executing-helper.sha256
          docker version > admission/docker-version.txt
          python3 -m unittest discover -s .github/scripts -p test_review_image.py > admission/offline-tests.log 2>&1
      - name: Verify actual successful origin and exact downloaded artifact bytes
        working-directory: admission
        run: |
          python3 ../.github/scripts/review_image.py origin origin.json > origin.log 2>&1
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${REVIEW_ARTIFACT_ID}/zip" > artifact.zip
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          origin = json.loads(pathlib.Path('origin.json').read_text())
          digest = hashlib.file_digest(open('artifact.zip', 'rb'), 'sha256').hexdigest()
          assert 'sha256:' + digest == origin['artifact_digest'], 'GitHub ZIP digest mismatch'
          pathlib.Path('artifact.sha256').write_text(digest + '  artifact.zip\n')
          with zipfile.ZipFile('artifact.zip') as archive:
              for name in archive.namelist():
                  path = pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts, 'Unsafe artifact member'
              archive.extractall('image')
          PY
          python3 ../.github/scripts/review_image.py local local.json > local.log 2>&1
      - name: Load saved bytes and require exact original image identity
        working-directory: admission
        run: |
          docker load --input image/image.tar.gz > docker-load.log 2>&1
          docker image inspect "$REVIEW_IMAGE_ID" > image/loaded-inspect.json
          python3 ../.github/scripts/review_image.py loaded loaded.json > loaded.log 2>&1
      - name: Preserve bounded admission receipts without image upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-image-admission-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            admission/*.json
            admission/*.log
            admission/*.txt
            admission/*.sha256
            admission/image/review-receipt.json
            admission/image/loaded-inspect.json
          if-no-files-found: error
