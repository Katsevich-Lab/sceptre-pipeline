<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="290" viewBox="0 0 1050 290" role="img" aria-labelledby="title desc"><title id="title">SCEPTRE scientific workflow</title><desc id="desc">Certified native schema-7 input is validated, configured, assigned and QC checked. Optional calibration, positive-control and discovery families execute in canonical order. Reference calls or certified whole-key workers and collectors retain package-owned complete-family statistics. Scientific results and provenance are exported.</desc><defs><style>text{font-family:system-ui,sans-serif;fill:#193e2e;font-size:15px}.small{font-size:12px;fill:#526f5b}.box{fill:#f0f6ed;stroke:#8eaf91;rx:8}.arrow{stroke:#598661;stroke-width:2;fill:none;marker-end:url(#end)}</style><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#598661"/></marker></defs><rect width="1050" height="290" fill="white"/><text x="25" y="32" font-weight="700">SCEPTRE pipeline · package-owned science, certified orchestration</text><g transform="translate(25 65)"><rect class="box" width="155" height="82"/><text x="15" y="30">Native schema-7 input</text><text class="small" x="15" y="55">RAM or native HDF5</text></g><path class="arrow" d="M185 105H215"/><g transform="translate(220 65)"><rect class="box" width="160" height="82"/><text x="15" y="27">Validate &amp; prepare</text><text class="small" x="15" y="49">Parameters → assignment</text><text class="small" x="15" y="67">Cell &amp; complete-pair QC</text></g><path class="arrow" d="M385 105H415"/><g transform="translate(420 65)"><rect class="box" width="240" height="82"/><text x="15" y="27">Selected scientific families</text><text class="small" x="15" y="49">Calibration → power → discovery</text><text class="small" x="15" y="67">Any family may be omitted</text></g><path class="arrow" d="M665 105H695"/><g transform="translate(700 65)"><rect class="box" width="315" height="82"/><text x="15" y="30">Scientific report &amp; portable native results</text><text class="small" x="15" y="55">Public plots · full tables · settings · provenance</text></g><g transform="translate(420 180)"><rect class="box" width="595" height="75"/><text x="15" y="27">Reference call or certified distributed prepare → workers → collect</text><text class="small" x="15" y="50">Whole-key RNG sharing, exact coverage and complete-family correction remain in SCEPTRE.</text></g><path class="arrow" d="M540 150V175"/><text class="small" x="25" y="236">Checkpoints and identical -resume retain</text><text class="small" x="25" y="255">source, inputs, currentness and RNG identities.</text></svg>
